<div class="container component-margin-bottom">
    <div class="header-container">
        <h2>Some coding on the side.</h2>
    </div>

    <div class="row row-splitter">
        <div class="col-12 col-sm-12 col-md-6 col-lg-5 col-xl-5 mobile-container">
            <a href="https://github.com/SandstormNick/MealPlanner" target="_blank">
                <div class="mobile-card">
                    <div class="mobile-info">
                        <h2>Mobile Dev</h2>
                    </div>
                    <div class="mobile-image-container">
                        <img src="../../../../../assets/images/mobile_image.png" alt="" class="mobile-image">
                    </div>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-12 col-md-6 col-lg-7 col-lg-7 npm-container">
            <a href="https://www.npmjs.com/package/ngx-quote-looper" target="_blank">
                <div class="npm-card">
                    <div class="npm-info">
                        <h2>NPM Package</h2>
                    </div>
                    <p>A package used to display quotes in a stylish way.</p>
                    <div class="npm-package-container">
                        <ngx-quote-looper 
                            [inputQuotes]="quoteData" 
                            [authorCSS]="{'text-align': 'right'}" 
                            [quoteCSS]="{'text-align': 'justify', 'font-size': 'var(--font-h3-smaller)'}"
                            [randomize]="true"
                            >
                        </ngx-quote-looper>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-sm-12 col-md-6 col-lg-7 col-xl-7 portfolio-container">
            <a href="/">
                <div class="portfolio-card">
                    <div class="portfolio-info">
                        <h2>Portfolio Site</h2>
                    </div>
                    <div class="portfolio-image-container">
                        <img src="../../../../../assets/images/portfolio_image.png" alt="" class="portfolio-image">
                    </div>
                </div>
            </a>
            
        </div>
        <div class="col-12 col-sm-12 col-md-6 col-lg-5 col-xl-5 coming-soon-container">
            <div class="coming-soon-card">
                <div class="coming-soon-info">
                    <h2>More <br> coming <br> soon...</h2>
                </div>
            </div>
        </div>
    </div>
</div>
